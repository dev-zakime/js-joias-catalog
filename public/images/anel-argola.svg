<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="silver3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A8A8A8"/>
      <stop offset="100%" stop-color="#4A4A4A"/>
    </linearGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bg3)"/>
  <!-- argola traseira -->
  <circle cx="230" cy="250" r="110" fill="none" stroke="url(#silver3)" stroke-width="16" opacity="0.85"/>
  <!-- argola frontal torcida -->
  <circle cx="270" cy="250" r="110" fill="none" stroke="url(#silver3)" stroke-width="16"/>
  <!-- brilho na frontal -->
  <path d="M180 180 a110 110 0 0 1 180 0" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.5" stroke-linecap="round"/>
  <!-- ponto de torção -->
  <circle cx="250" cy="360" r="6" fill="#A855F7"/>
</svg>
