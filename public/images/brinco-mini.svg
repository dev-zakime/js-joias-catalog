<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg5" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="silver5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#B0B0B0"/>
      <stop offset="100%" stop-color="#5A5A5A"/>
    </linearGradient>
    <radialGradient id="gem5" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bg5)"/>
  <g>
    <!-- esquerda -->
    <circle cx="175" cy="210" r="10" fill="none" stroke="url(#silver5)" stroke-width="4"/>
    <line x1="175" y1="220" x2="175" y2="270" stroke="url(#silver5)" stroke-width="3"/>
    <circle cx="175" cy="285" r="22" fill="url(#gem5)"/>
    <circle cx="175" cy="285" r="22" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
    <!-- direita -->
    <circle cx="325" cy="210" r="10" fill="none" stroke="url(#silver5)" stroke-width="4"/>
    <line x1="325" y1="220" x2="325" y2="270" stroke="url(#silver5)" stroke-width="3"/>
    <circle cx="325" cy="285" r="22" fill="url(#gem5)"/>
    <circle cx="325" cy="285" r="22" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.5"/>
  </g>
</svg>
