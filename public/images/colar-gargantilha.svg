<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg9" cx="50%" cy="40%">
      <stop offset="0%" stop-color="#1F1F1F"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <linearGradient id="silver9" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#B0B0B0"/>
      <stop offset="100%" stop-color="#5A5A5A"/>
    </linearGradient>
    <radialGradient id="gem9" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E9D5FF"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#bg9)"/>
  <!-- gargantilha (curva mais fechada, perto do pescoço) -->
  <path d="M140 220 Q250 340 360 220" fill="none" stroke="url(#silver9)" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/>
  <!-- detalhe central -->
  <circle cx="250" cy="300" r="26" fill="url(#gem9)"/>
  <circle cx="250" cy="300" r="26" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.6"/>
  <!-- pequenos detalhes laterais -->
  <circle cx="215" cy="295" r="5" fill="url(#silver9)"/>
  <circle cx="285" cy="295" r="5" fill="url(#silver9)"/>
</svg>
